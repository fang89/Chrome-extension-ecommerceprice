</style><rect class="bg" x="0.5" y="0.5" width="899" height="443" rx="14"/><text class="t" x="24" y="38" font-size="20" font-weight="700" text-anchor="start">Same item, not a similar one</text><text class="m" x="24" y="62" font-size="13.5" font-weight="400" text-anchor="start">The page title is cut to keywords. A listing only counts if it passes every check.</text><rect class="chip" x="24" y="80" width="86.8" height="30" rx="15"/><text class="t" x="67.4" y="100" font-size="14" font-weight="600" text-anchor="middle">logitech</text><rect class="chip" x="118.8" y="80" width="35.2" height="30" rx="15"/><text class="t" x="136.4" y="100" font-size="14" font-weight="600" text-anchor="middle">mx</text><rect class="chip" x="162.0" y="80" width="69.6" height="30" rx="15"/><text class="t" x="196.8" y="100" font-size="14" font-weight="600" text-anchor="middle">master</text><rect class="chipk" x="239.6" y="80" width="35.2" height="30" rx="15"/><text class="t" x="257.2" y="100" font-size="14" font-weight="600" text-anchor="middle">3s</text><rect class="chip" x="282.8" y="80" width="86.8" height="30" rx="15"/><text class="t" x="326.2" y="100" font-size="14" font-weight="600" text-anchor="middle">wireless</text><rect class="chip" x="377.6" y="80" width="112.6" height="30" rx="15"/><text class="t" x="433.90000000000003" y="100" font-size="14" font-weight="600" text-anchor="middle">performance</text><rect class="chip" x="498.20000000000005" y="80" width="61.0" height="30" rx="15"/><text class="t" x="528.7" y="100" font-size="14" font-weight="600" text-anchor="middle">mouse</text><text class="m" x="575.2" y="92" font-size="12" font-weight="400" text-anchor="start">blue = first 3 keywords</text><text class="m" x="575.2" y="108" font-size="12" font-weight="400" text-anchor="start">yellow = model number</text><rect class="okb" x="24" y="128" width="852" height="50" rx="10"/><text class="ok" x="46" y="160" font-size="20" font-weight="800" text-anchor="middle">✓</text><text class="t" x="68" y="150" font-size="14.5" font-weight="600" text-anchor="start">Logitech MX Master 3S Wireless Performance Mouse</text><text class="m" x="68" y="168" font-size="12.5" font-weight="400" text-anchor="start">has brand + model + &quot;mx master&quot; together + 3S</text><text class="t" x="856" y="159" font-size="15" font-weight="700" text-anchor="end">S$105</text><rect class="nob" x="24" y="184" width="852" height="50" rx="10"/><text class="no" x="46" y="216" font-size="20" font-weight="800" text-anchor="middle">✗</text><text class="t" x="68" y="206" font-size="14.5" font-weight="600" text-anchor="start">Logitech MX Anywhere 3S Compact Mouse</text><text class="m" x="68" y="224" font-size="12.5" font-weight="400" text-anchor="start">missing &quot;master&quot;: a different mouse</text><text class="t" x="856" y="215" font-size="15" font-weight="700" text-anchor="end">S$95</text><rect class="nob" x="24" y="240" width="852" height="50" rx="10"/><text class="no" x="46" y="272" font-size="20" font-weight="800" text-anchor="middle">✗</text><text class="t" x="68" y="262" font-size="14.5" font-weight="600" text-anchor="start">Logitech MX Master 3 Mouse (older model)</text><text class="m" x="68" y="280" font-size="12.5" font-weight="400" text-anchor="start">missing model number &quot;3s&quot;</text><text class="t" x="856" y="271" font-size="15" font-weight="700" text-anchor="end">S$89</text><rect class="nob" x="24" y="296" width="852" height="50" rx="10"/><text class="no" x="46" y="328" font-size="20" font-weight="800" text-anchor="middle">✗</text><text class="t" x="68" y="318" font-size="14.5" font-weight="600" text-anchor="start">Silicone Case for Logitech MX Master 3S</text><text class="m" x="68" y="336" font-size="12.5" font-weight="400" text-anchor="start">accessory word &quot;case&quot; (and under 35% of the price)</text><text class="t" x="856" y="327" font-size="15" font-weight="700" text-anchor="end">S$12.90</text><rect class="nob" x="24" y="352" width="852" height="50" rx="10"/><text class="no" x="46" y="384" font-size="20" font-weight="800" text-anchor="middle">✗</text><text class="t" x="68" y="374" font-size="14.5" font-weight="600" text-anchor="start">Logitech MX Keys S Keyboard + Master combo</text><text class="m" x="68" y="392" font-size="12.5" font-weight="400" text-anchor="start">no &quot;3s&quot;, &quot;mx&quot; and &quot;master&quot; not side by side, only 38% of keywords</text><text class="t" x="856" y="383" font-size="15" font-weight="700" text-anchor="end">S$269</text><text class="m" x="24" y="426" font-size="12.5" font-weight="400" text-anchor="start">Non-matches are still there behind &quot;show N other results&quot;, tagged with their % match.</text></svg>