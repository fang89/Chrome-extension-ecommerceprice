<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="How each store is checked: Amazon and Lazada fetched directly, Shopee and PDD read from a hidden tab"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
 .box{fill:#f6f8fa;stroke:#d0d7de} .ln{stroke:#8c959f} .lnf{fill:#8c959f}
 .okb{fill:#dafbe1;stroke:#2da44e} .ok{fill:#1a7f37} .nob{fill:#ffebe9;stroke:#cf222e} .no{fill:#cf222e}
 .chip{fill:#ddf4ff;stroke:#54aeff} .chipk{fill:#fff8c5;stroke:#d4a72c} .acc{fill:#bc4c00} .accb{fill:#fff1e5;stroke:#f97316}
 .pur{fill:#fbefff;stroke:#a475f9}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1}
  .box{fill:#161b22;stroke:#30363d} .ln{stroke:#6e7681} .lnf{fill:#6e7681}
  .okb{fill:#0f2e1b;stroke:#3fb950} .ok{fill:#3fb950} .nob{fill:#3a1418;stroke:#f85149} .no{fill:#f85149}
  .chip{fill:#0c2d6b;stroke:#58a6ff} .chipk{fill:#3b2e05;stroke:#d4a72c} .acc{fill:#f0883e} .accb{fill:#3a1d08;stroke:#f97316}
  .pur{fill:#2b1a42;stroke:#a475f9}
 }
</style><rect class="bg" x="0.5" y="0.5" width="899" height="371" rx="14"/><text class="t" x="24" y="38" font-size="20" font-weight="700" text-anchor="start">How each store is checked</text><text class="m" x="24" y="62" font-size="13.5" font-weight="400" text-anchor="start">All of it happens inside your own browser. Prices are converted to S$ at live rates.</text><rect class="accb" x="24" y="150" width="180" height="92" rx="12"/><text class="t" x="114" y="182" font-size="16" font-weight="700" text-anchor="middle">Product page</text><text class="m" x="114" y="204" font-size="12.5" font-weight="400" text-anchor="middle">title · price · photo</text><text class="m" x="114" y="222" font-size="12.5" font-weight="400" text-anchor="middle">read from the page</text><rect class="pur" x="250" y="150" width="170" height="92" rx="12"/><text class="t" x="335" y="182" font-size="16" font-weight="700" text-anchor="middle">Background</text><text class="t" x="335" y="202" font-size="16" font-weight="700" text-anchor="middle">worker</text><text class="m" x="335" y="224" font-size="12.5" font-weight="400" text-anchor="middle">the extension itself</text><line class="ln" x1="206" y1="196" x2="239.0" y2="196.0" stroke-width="2"/><path class="lnf" d="M248,196 L239.0,191.0 L239.0,201.0 Z"/><rect class="box" x="466" y="84" width="410" height="56" rx="10"/><text class="t" x="482" y="108" font-size="15" font-weight="700" text-anchor="start">Amazon.sg · Amazon.com</text><text class="m" x="482" y="128" font-size="12.5" font-weight="400" text-anchor="start">search page fetched directly, listings parsed</text><line class="ln" x1="422" y1="196" x2="460.0" y2="120.0" stroke-width="2"/><path class="lnf" d="M464,112 L455.5,117.8 L464.4,122.3 Z"/><rect class="box" x="466" y="150" width="410" height="56" rx="10"/><text class="t" x="482" y="174" font-size="15" font-weight="700" text-anchor="start">Lazada</text><text class="m" x="482" y="194" font-size="12.5" font-weight="400" text-anchor="start">search results fetched as data</text><line class="ln" x1="422" y1="196" x2="455.7" y2="181.5" stroke-width="2"/><path class="lnf" d="M464,178 L453.8,176.9 L457.7,186.1 Z"/><rect class="box" x="466" y="216" width="410" height="56" rx="10"/><text class="t" x="482" y="240" font-size="15" font-weight="700" text-anchor="start">Shopee</text><text class="m" x="482" y="260" font-size="12.5" font-weight="400" text-anchor="start">search opened in a hidden tab with your login, read, closed</text><line class="ln" x1="422" y1="196" x2="458.1" y2="237.2" stroke-width="2"/><path class="lnf" d="M464,244 L461.8,233.9 L454.3,240.5 Z"/><rect class="box" x="466" y="282" width="410" height="56" rx="10"/><text class="t" x="482" y="306" font-size="15" font-weight="700" text-anchor="start">PDD</text><text class="m" x="482" y="326" font-size="12.5" font-weight="400" text-anchor="start">keywords translated to Chinese, sorted by sales, hidden tab</text><line class="ln" x1="422" y1="196" x2="460.9" y2="301.6" stroke-width="2"/><path class="lnf" d="M464,310 L465.6,299.8 L456.2,303.3 Z"/><text class="m" x="24" y="352" font-size="12.5" font-weight="400" text-anchor="start">Results come back to the page, get matched and ranked, and the cheapest real match wins. PDD&#x27;s pick is its best seller.</text></svg>