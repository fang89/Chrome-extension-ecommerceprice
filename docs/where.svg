  .chip{fill:#0c2d6b;stroke:#58a6ff} .chipk{fill:#3b2e05;stroke:#d4a72c} .acc{fill:#f0883e} .accb{fill:#3a1d08;stroke:#f97316}
  .pur{fill:#2b1a42;stroke:#a475f9}
 }
</style><rect class="bg" x="0.5" y="0.5" width="899" height="299" rx="14"/><text class="t" x="24" y="38" font-size="20" font-weight="700" text-anchor="start">The answer shows up in three places</text><text class="m" x="24" y="62" font-size="13.5" font-weight="400" text-anchor="start">Green = another store is cheaper · orange = this page is already the cheapest · grey = still checking</text><rect class="box" x="24" y="84" width="270" height="192" rx="10"/><text class="t" x="40" y="110" font-size="15" font-weight="700" text-anchor="start">1 · Panel on the right</text><rect x="40" y="124" width="238" height="104" rx="10" fill="#0a8a43"/><text x="54" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" letter-spacing=".07em">★ CHEAPER ON</text><text x="54" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fff">Lazada</text><text x="54" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">S$105.00</text><rect x="54" y="208" width="150" height="14" rx="7" fill="#fff"/><text x="129" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#0a8a43" text-anchor="middle">Save S$44.00 (30%)</text><text class="m" x="40" y="252" font-size="12.5" font-weight="400" text-anchor="start">every store&#x27;s matches listed below,</text><text class="m" x="40" y="268" font-size="12.5" font-weight="400" text-anchor="start">» folds it to a thin strip</text><rect class="box" x="314" y="84" width="270" height="192" rx="10"/><text class="t" x="330" y="110" font-size="15" font-weight="700" text-anchor="start">2 · Badge under the price</text><text x="330" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#d0011b">$149.00</text><rect x="330" y="162" width="238" height="40" rx="9" fill="#e8f7ee" stroke="#0a8a43" stroke-width="2.5"/><rect x="340" y="172" width="70" height="20" rx="5" fill="#0a8a43"/><text x="375" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">★ CHEAPER</text><text x="418" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0a8a43">Lazada</text><text x="466" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0a8a43">S$105.00</text><text class="m" x="330" y="236" font-size="12.5" font-weight="400" text-anchor="start">sits right under the store&#x27;s own</text><text class="m" x="330" y="252" font-size="12.5" font-weight="400" text-anchor="start">price; click it to open the deal</text><rect class="box" x="604" y="84" width="272" height="192" rx="10"/><text class="t" x="620" y="110" font-size="15" font-weight="700" text-anchor="start">3 · Toolbar icon</text><rect class="bg" x="620" y="132" width="240" height="44" rx="8"/><circle cx="806" cy="154" r="11" class="lnf"/><rect x="812" y="134" width="40" height="20" rx="6" fill="#0a8a43"/><text x="832" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">-30%</text><rect x="636" y="146" width="140" height="16" rx="8" class="box"/><text class="m" x="620" y="214" font-size="12.5" font-weight="400" text-anchor="start">shows -30% (or ✓) even when you&#x27;ve</text><text class="m" x="620" y="230" font-size="12.5" font-weight="400" text-anchor="start">scrolled away; click it to open or</text><text class="m" x="620" y="246" font-size="12.5" font-weight="400" text-anchor="start">fold the panel</text></svg>