<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Three places: the panel on the right, a badge under the price, and the toolbar icon"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
 .box{fill:#f6f8fa;stroke:#d0d7de} .ln{stroke:#8c959f} .lnf{fill:#8c959f}
 .okb{fill:#dafbe1;stroke:#2da44e} .ok{fill:#1a7f37} .nob{fill:#ffebe9;stroke:#cf222e} .no{fill:#cf222e}
 .chip{fill:#ddf4ff;stroke:#54aeff} .chipk{fill:#fff8c5;stroke:#d4a72c} .acc{fill:#bc4c00} .accb{fill:#fff1e5;stroke:#f97316}
